# Dependabot（SEC-062）：每周一检查一次 npm 依赖与 GitHub Actions 的新版本，有更新时自动开 PR。
# 小版本与补丁更新合并为每周一个 PR；主版本升级各自单独一个 PR（VER-032）。这些 PR 同样要通过 CI，经项目所有者确认后合并。
# 提交说明的前缀使 PR 标题符合 OPS-001：npm 依赖为 build(deps)、build(deps-dev)，Actions 为 ci(deps)。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node 的主版本跟随 .nvmrc 中的 Node.js 主版本（VER-031、OPS-014），升级 Node.js 时一并手工升级
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
