# 发版：推送 v* 标签时在 macOS、Windows、Linux 上分别打安装包，并建一个草稿 Release 附上全部安装包（确认后在网页上点发布）。
# 也可以在 Actions 页面手动运行（只打包、作为附件下载，不建 Release）。
# 注意：私有仓库里 macOS 机器按 10 倍计分钟数，所以只在打标签或手动时运行。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 没有正式证书：macOS 用 package.json 里的临时签名
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "弈 ${GITHUB_REF_NAME#v}" --notes "安装包见下方附件。macOS 首次打开时在访达里右键点“打开”，或在“系统设置 · 隐私与安全性”里点“仍要打开”。Windows 首次运行时如果提示未知发布者，点“更多信息”再点“仍要运行”。"
