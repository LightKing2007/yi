# 发版：推送 v* 标签时（由 npm run release 推送），先核对标签与版本号、更新日志，跑一遍检查，
# 再在 macOS、Windows、Linux 上分别打安装包，连同服务端（yi-server-版本.cjs）、校验和（SHA256SUMS）与软件物料清单（yi-sbom-版本.cdx.json）一起建一个草稿 Release，
# 说明取自游戏里这一版的更新日志。确认后在网页上点发布，再 npm run deploy 上线。流程见 docs/procedures/release.md，规则见 OPS-020 至 OPS-033。
# 也可以在 Actions 页面手动运行（只打包、作为附件下载，不建 Release）。
# 注意：私有仓库里 macOS 机器按 10 倍计分钟数，所以只在打标签或手动时运行。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 最小权限（OPS-011）：只有建草稿 Release 的 publish 另外声明写权限
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 标签与版本号、更新日志对得上
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "标签 $GITHUB_REF_NAME 与 package.json 的版本 $v 不一致"; exit 1; }
          node scripts/changelog.mjs check "$v"
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 没有正式证书：macOS 用 package.json 里的临时签名
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: 服务端也作为附件
        if: runner.os == 'Linux'
        run: cp dist-server/server.cjs "release/yi-server-$(node -p "require('./package.json').version").cjs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/yi-server-*.cjs
          if-no-files-found: error
          retention-days: 3 # 只供本次运行的 publish 转交给 Release；Release 里另有一份，附件不必久存

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: 软件物料清单与校验和
        run: |
          v=${GITHUB_REF_NAME#v}
          # 软件物料清单（OPS-032）：按锁定文件列出全部依赖，CycloneDX 格式
          npm sbom --sbom-format cyclonedx --package-lock-only > "dist/yi-sbom-$v.cdx.json"
          # 校验和（OPS-030、SEC-070）：全部附件的 SHA-256，格式与下载页面的 /SHA256SUMS 相同，上线脚本据此核对（OPS-031）
          (cd dist && sha256sum Yi-* yi-server-*.cjs yi-sbom-*.cdx.json > SHA256SUMS && cat SHA256SUMS)
      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "弈 ${GITHUB_REF_NAME#v}" --notes-file notes.md
