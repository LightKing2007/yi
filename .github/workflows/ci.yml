# 每个 PR 与合并到 main 后：格式检查、违规棘轮、类型检查、测试与覆盖率、构建。PR 还要检查标题的格式（合并时它就是 main 上的提交说明）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # 只跑类型检查与测试，不需要 Electron 本体
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # 改动行覆盖率以 HEAD^1 为基准：PR 的检查运行在合并提交上，其第一个父提交即 main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check # COD-006：格式由 Prettier 决定
      - name: 违规棘轮（OPS-015：ESLint、jscpd 与 01-coding.md 的其他度量均不得超过基线，基线也不得高于 main 上的）
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:docs/audits/baseline.json > "$RUNNER_TEMP/main-baseline.json" 2>/dev/null || cp docs/audits/baseline.json "$RUNNER_TEMP/main-baseline.json"
          npm run -s ratchet -- --base "$RUNNER_TEMP/main-baseline.json"
      - run: npm run typecheck
      - run: npm run test:coverage # 测试与覆盖率门槛（TST-010）
      - run: node scripts/diff-coverage.mjs HEAD^1 # 改动行覆盖率 ≥ 80%（TST-011）
      - run: npm run build:web
      - run: npm run build:node

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 'PR 标题写成「类型: 说明」'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert|release)(\([^)]+\))?!?: .+' && exit 0
          echo "PR 标题要写成「类型: 说明」，例如 feat: 安装包下载页（类型见 docs/procedures/release.md 第 2 章），现在是：$TITLE"
          exit 1
