# 平台冒烟检查（checklists.md 第 3 节中可以自动化的部分，见 scripts/smoke-app.mjs）：在 GitHub 的 Ubuntu、macOS、Windows 机器上
# 从当前提交打出安装程序，按玩家的方式安装后启动并检查，Windows 另检查卸载；截图作为附件。手动运行，发版前对待发布的提交运行一次。
# Linux 先在开启 Chromium 沙箱的情况下运行，这才是玩家的实际情况；不通过时再以 --no-sandbox 运行一次，用来区分是否为沙箱的问题。
# 打包后另核对 Electron Fuses 已按 package.json 的 build.electronFuses 写入（scripts/check-fuses.mjs，SEC-033）。
# 不能自动化、仍须在实机上确认的项：macOS 公证提示与 Windows SmartScreen 的首次打开提示、声音、与真人联机对局、Intel 芯片的 Mac。
name: 平台冒烟检查

on:
  workflow_dispatch:
  pull_request: # 改动检查本身时自动运行一次
    paths:
      - .github/workflows/smoke.yml
      - scripts/smoke-app.mjs

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 没有正式证书：macOS 用 package.json 里的临时签名
      CSC_FOR_PULL_REQUEST: 'true' # PR 中运行时 electron-builder 默认跳过签名；照发版时一样签名，检查的才是玩家拿到的安装程序
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # ---------------- Linux：AppImage ----------------
      - if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      - name: 核对 Electron Fuses（SEC-033）
        if: runner.os == 'Linux'
        run: |
          node scripts/check-fuses.mjs release/linux-unpacked/yi
          # 探针：未经改动的 Electron 必须判为不符（退出码 1），证明核对确实有效。取自 electron-builder 打包时下载到缓存的压缩包
          # （npm ci 不执行安装脚本，node_modules 中没有 Electron 本体）
          unzip -p "$(ls ~/.cache/electron/electron-v*-linux-x64.zip | head -1)" electron > "$RUNNER_TEMP/electron-stock"
          status=0; node scripts/check-fuses.mjs "$RUNNER_TEMP/electron-stock" || status=$?
          test "$status" = 1
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - name: 启动 AppImage 并检查（开启沙箱）
        if: runner.os == 'Linux'
        id: sandboxed
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # 运行机器上没有 FUSE 2：AppImage 解压后运行
          # 运行机器没有 GPU，不附加任何参数：游戏自身启用 SwiftShader 软件渲染（electron/main.ts，P1-18），在此验证
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/smoke-app.mjs "$(ls release/*.AppImage)" smoke
      - name: 启动 AppImage 并检查（--no-sandbox，仅用于诊断）
        if: runner.os == 'Linux' && steps.sandboxed.outcome == 'failure'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          SMOKE_ARGS: --no-sandbox
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/smoke-app.mjs "$(ls release/*.AppImage)" smoke-no-sandbox
      - name: 开启沙箱时未通过
        if: runner.os == 'Linux' && steps.sandboxed.outcome == 'failure'
        run: exit 1

      # ---------------- macOS：DMG（运行机器为 Apple 芯片，只打 arm64） ----------------
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
      - name: 核对 Electron Fuses（SEC-033）
        if: runner.os == 'macOS'
        run: node scripts/check-fuses.mjs release/mac-arm64/弈.app
      - name: 校验 DMG 中应用的签名
        if: runner.os == 'macOS'
        id: codesign
        continue-on-error: true
        run: |
          mnt=$(mktemp -d)
          hdiutil attach "$(ls release/*-arm64.dmg)" -nobrowse -readonly -mountpoint "$mnt"
          app=$(ls -d "$mnt"/*.app)
          codesign --display --verbose=4 "$app" 2>&1 || true
          ls -la "$app/Contents/_CodeSignature" || true
          status=0
          codesign --verify --deep --strict --verbose=2 "$app" || status=$?
          hdiutil detach "$mnt"
          exit $status
      - name: 从 DMG 安装并检查
        if: runner.os == 'macOS'
        run: |
          mnt=$(mktemp -d)
          hdiutil attach "$(ls release/*-arm64.dmg)" -nobrowse -readonly -mountpoint "$mnt"
          app_dir="$RUNNER_TEMP/Applications"
          mkdir -p "$app_dir"
          ditto "$mnt"/*.app "$app_dir/$(basename "$mnt"/*.app)" # 与在访达中拖到“应用程序”相同：保留符号链接与扩展属性
          hdiutil detach "$mnt"
          app=$(ls -d "$app_dir"/*.app)
          # plutil 原样输出可执行文件名（defaults read 会把“弈”转义为 \u5f08）
          node scripts/smoke-app.mjs "$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" smoke
      - name: 签名校验未通过
        if: runner.os == 'macOS' && steps.codesign.outcome == 'failure'
        run: exit 1

      # ---------------- Windows：NSIS 安装程序（静默安装、检查、静默卸载） ----------------
      - if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: 核对 Electron Fuses（SEC-033）
        if: runner.os == 'Windows'
        run: node scripts/check-fuses.mjs release/win-unpacked/弈.exe
      - name: 静默安装并检查，再静默卸载
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # 当前用户安装（NSIS 的默认）：%LOCALAPPDATA%\Programs\<产品名>\
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 -Filter *.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw '安装后没有找到游戏的可执行文件' }
          Write-Host "已安装：$($exe.FullName)"
          node scripts/smoke-app.mjs $exe.FullName smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = $exe.DirectoryName
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          # 卸载程序把自己复制到临时目录后在后台删除文件：最多等 60 秒
          for ($i = 0; $i -lt 60 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe.FullName) { throw "卸载后游戏仍在：$($exe.FullName)" }
          Write-Host '✓ 静默卸载后游戏文件已删除'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: smoke*/*.png
          retention-days: 7 # 截图只供当次核对
