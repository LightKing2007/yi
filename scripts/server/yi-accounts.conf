# 弈 联机服务端的账号功能（yi.service 的附加配置）。打开账号功能时由 root 安装到 /etc/systemd/system/yi.service.d/accounts.conf，
# 再 systemctl daemon-reload 并经上线脚本重启；关闭时删除本文件。步骤见 docs/procedures/ops.md 的“账号功能”一节。
# 密钥与发信凭据经 LoadCredential= 传入（SEC-051），严禁写入 Environment=；两份凭据文件属主 root、权限 0600：
#   /etc/yi/credentials/yi-account-keys  由 node /opt/yi/current/server.cjs account-keys 生成
#   /etc/yi/credentials/yi-smtp          阿里云邮件推送的 SMTP 配置，格式见 server/accountSecrets.ts
[Service]
Environment=YI_ACCOUNTS=1
# 文书正式生效后填入其版本号；版本号变化时，玩家须重新同意才能联机
Environment=YI_PRIVACY_VERSION=
Environment=YI_TERMS_VERSION=
LoadCredential=yi-account-keys:/etc/yi/credentials/yi-account-keys
LoadCredential=yi-smtp:/etc/yi/credentials/yi-smtp
